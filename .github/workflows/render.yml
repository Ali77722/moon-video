name: Render Moon Video
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: node render.js
      - uses: actions/upload-artifact@v4
        with:
          name: moon-video-mp4
          path: moon-video.mp4
          retention-days: 14
